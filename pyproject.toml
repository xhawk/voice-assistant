[project]
name = "home-assistant-voice-client"
version = "0.1.0"
description = "Voice assistant client for Home Assistant"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "python-dotenv",
    "faster-whisper",
    "sounddevice",
    "pvporcupine",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
